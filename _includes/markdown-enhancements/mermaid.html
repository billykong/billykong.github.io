<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  // kramdown renders ```mermaid fences as highlighted code blocks; turn each
  // into the plain <pre class="mermaid"> that Mermaid looks for.
  document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid').forEach(function (el) {
    var block = el.tagName === 'CODE' ? el.parentElement : el;
    var pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = el.textContent;
    block.replaceWith(pre);
  });
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
  mermaid.run();
</script>
